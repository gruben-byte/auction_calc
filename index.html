<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101820"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Bid Tracker">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<title>Auction Bid Tracker</title>
<style>
:root{--bg:#0d1218;--panel:#17212b;--key:#263746;--accent:#39c779;--warn:#ffb020;--danger:#ef5b5b;--text:#f7f9fb;--muted:#9eb0bf}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100dvh;overscroll-behavior:none}.app{max-width:520px;margin:auto;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 14px)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}h1{font-size:18px;margin:0}.iconbtn{border:0;background:var(--panel);color:var(--text);border-radius:12px;padding:10px 12px;font-size:15px}.display{background:var(--panel);border-radius:20px;padding:16px;text-align:center;margin-bottom:10px}.label{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700}.amount{font-size:42px;line-height:1.18;font-weight:800;font-variant-numeric:tabular-nums;margin:5px 0}.remaining{font-size:15px;color:var(--muted)}.remaining.warning{color:var(--warn)}.remaining.over{color:var(--danger);font-weight:700}.presets,.keypad,.actions{display:grid;gap:8px}.presets{grid-template-columns:repeat(3,1fr);margin-bottom:8px}.keypad{grid-template-columns:repeat(3,1fr)}button{touch-action:manipulation;user-select:none;min-height:58px;border:0;border-radius:15px;background:var(--key);color:var(--text);font-size:21px;font-weight:700}.preset{background:#194b38;color:#dffff0;font-size:18px}.operator{background:#4c3a18;color:#ffe5a9}.wide{grid-column:span 2}.zero{grid-column:span 2}.actions{grid-template-columns:1fr 1fr;margin-top:8px}.undo{background:#44394e}.reset{background:#4b2528}.mode{display:flex;gap:8px;margin:8px 0}.mode button{flex:1;min-height:44px;font-size:14px}.mode .active{outline:2px solid var(--accent)}.entry{min-height:24px;text-align:center;color:var(--warn);font-variant-numeric:tabular-nums;margin:3px 0 7px}.history{margin-top:10px;background:var(--panel);border-radius:16px;padding:12px}.history h2{font-size:15px;margin:0 0 8px}.history ol{margin:0;padding-left:28px;max-height:125px;overflow:auto;color:var(--muted);font-variant-numeric:tabular-nums}.history li{padding:3px 0}.flash{animation:flash .15s}@keyframes flash{50%{transform:scale(.985);filter:brightness(1.25)}}
</style></head>
<body><main class="app" id="app"><header><h1>Auction Bid Tracker</h1><button class="iconbtn" id="market">Not on market</button></header>
<section class="display"><div class="label">CURRENT BID</div><div class="amount" id="amount">$0</div><div id="remaining" class="remaining">Set a limit if you want a warning</div></section>
<div class="presets"><button class="preset" data-add="1000">+$1k</button><button class="preset" data-add="5000">+$5k</button><button class="preset" data-add="10000">+$10k</button></div>
<div class="mode"><button id="bidMode" class="active">Adjust bid</button><button id="limitMode">Set limit</button></div><div class="entry" id="entry">Enter an amount, then tap + or −</div>
<div class="keypad" id="keypad">
<button data-digit="1">1</button><button data-digit="2">2</button><button data-digit="3">3</button>
<button data-digit="4">4</button><button data-digit="5">5</button><button data-digit="6">6</button>
<button data-digit="7">7</button><button data-digit="8">8</button><button data-digit="9">9</button>
<button class="zero" data-digit="0">0</button><button data-action="back">⌫</button>
<button class="operator" data-action="minus">−</button><button class="operator" data-action="set">SET</button><button class="operator" data-action="plus">+</button>
</div>
<div class="actions"><button class="undo" id="undo">Undo</button><button class="reset" id="reset">Reset</button></div>
<section class="history"><h2>Bid history</h2><ol id="history"></ol></section></main>
<script>
const $=s=>document.querySelector(s), fmt=n=>new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD',maximumFractionDigits:0}).format(n);
let state=JSON.parse(localStorage.getItem('bidTracker')||'null')||{bid:0,limit:0,history:[],market:false};let entry='',mode='bid';
function save(){localStorage.setItem('bidTracker',JSON.stringify(state))}function buzz(){if(navigator.vibrate)navigator.vibrate(25)}
function render(){ $('#amount').textContent=fmt(state.bid); $('#market').textContent=state.market?'ON THE MARKET':'Not on market'; $('#market').style.background=state.market?'#19613f':''; const r=$('#remaining'); r.className='remaining'; if(state.limit){let d=state.limit-state.bid;r.textContent=d>=0?fmt(d)+' remaining':fmt(-d)+' over limit';if(d<0)r.classList.add('over');else if(d<=25000)r.classList.add('warning')}else r.textContent='Set a limit if you want a warning'; $('#entry').textContent=entry?(mode==='limit'?'Limit: ':'Entry: ')+fmt(Number(entry)):(mode==='limit'?'Enter your maximum, then tap SET':'Enter an amount, then tap + or −'); $('#history').innerHTML=state.history.slice().reverse().map(x=>`<li>${x.label}: <strong>${fmt(x.value)}</strong></li>`).join(''); save()}
function snapshot(label,newBid){state.history.push({label,value:newBid,previous:state.bid});state.bid=Math.max(0,newBid);entry='';buzz();$('#app').classList.remove('flash');void $('#app').offsetWidth;$('#app').classList.add('flash');render()}
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>snapshot(b.textContent,state.bid+Number(b.dataset.add)));
$('#keypad').onclick=e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.digit){if(entry.length<9)entry+=b.dataset.digit}else if(b.dataset.action==='back')entry=entry.slice(0,-1);else{let n=Number(entry);if(b.dataset.action==='set'&&n){if(mode==='limit'){state.limit=n;entry=''}else snapshot('Set',n)}if(b.dataset.action==='plus'&&n)snapshot('+'+fmt(n),state.bid+n);if(b.dataset.action==='minus'&&n)snapshot('−'+fmt(n),state.bid-n)}render()};
$('#bidMode').onclick=()=>{mode='bid';$('#bidMode').classList.add('active');$('#limitMode').classList.remove('active');entry='';render()};$('#limitMode').onclick=()=>{mode='limit';$('#limitMode').classList.add('active');$('#bidMode').classList.remove('active');entry='';render()};
$('#undo').onclick=()=>{let x=state.history.pop();if(x){state.bid=x.previous;buzz();render()}};$('#reset').onclick=()=>{if(confirm('Clear the current bid, limit and history?')){state={bid:0,limit:0,history:[],market:false};entry='';render()}};$('#market').onclick=()=>{state.market=!state.market;buzz();render()};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render();
</script></body></html>
